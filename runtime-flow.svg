<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="Arial, sans-serif">
  <rect width="1100" height="750" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#232f3e">Runtime Flow</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#666">Lambda collects usage every N min; quotas cached daily in S3; OAM streams native metrics</text>

  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
    </marker>
    <marker id="arrPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6a1b9a"/>
    </marker>
    <marker id="arrTeal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00695c"/>
    </marker>
  </defs>

  <!-- ===== MONITORING ACCOUNT ===== -->
  <rect x="40" y="80" width="480" height="630" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <text x="280" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Monitoring Account (Hub)</text>

  <!-- EventBridge -->
  <rect x="70" y="125" width="180" height="45" rx="8" fill="white" stroke="#1976d2" stroke-width="1.5"/>
  <text x="160" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">EventBridge Schedule</text>
  <text x="160" y="162" text-anchor="middle" font-size="10" fill="#555">rate(N minutes)</text>

  <!-- Lambda -->
  <rect x="70" y="185" width="420" height="95" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="280" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">bedrock_LimitsTracker Lambda</text>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#444">Role: BedrockLimitsTrackerLambdaRole</text>
  <text x="280" y="248" text-anchor="middle" font-size="10" fill="#1565c0">Allows: sts:AssumeRole → *:SpokeRole | cloudwatch:PutMetricData</text>
  <text x="280" y="265" text-anchor="middle" font-size="10" fill="#1565c0">        cloudwatch:PutDashboard | ssm:Get/PutParameter | s3:Get/PutObject</text>

  <line x1="160" y1="170" x2="160" y2="182" stroke="#1565c0" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- S3 Cache -->
  <rect x="70" y="300" width="420" height="70" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="280" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">S3: bedrock-limits-cache-{AccountId}</text>
  <text x="280" y="343" text-anchor="middle" font-size="10" fill="#555">quota-cache/{account}/{region}.json</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#6a1b9a">Refreshed once per 24h | Read every invocation (~70s vs ~240s)</text>

  <!-- OAM Sink -->
  <rect x="70" y="390" width="420" height="60" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="280" y="413" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">OAM Sink (BedrockLimitsTrackerSink)</text>
  <text x="280" y="433" text-anchor="middle" font-size="10" fill="#555">Receives AWS/Bedrock metrics from all linked accounts (FREE)</text>

  <!-- Dashboard -->
  <rect x="70" y="470" width="200" height="90" rx="8" fill="white" stroke="#1565c0" stroke-width="1.5"/>
  <text x="170" y="493" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">Bedrock-Limits-Tracker</text>
  <text x="170" y="510" text-anchor="middle" font-size="9" fill="#555">Summary + Numbers</text>
  <text x="170" y="524" text-anchor="middle" font-size="9" fill="#555">Regions Affected</text>
  <text x="170" y="538" text-anchor="middle" font-size="9" fill="#555">Top 10 TPM/RPM</text>
  <text x="170" y="552" text-anchor="middle" font-size="9" fill="#555">Per-Account Tables</text>

  <!-- Alarms -->
  <rect x="290" y="470" width="200" height="90" rx="8" fill="white" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="390" y="493" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">Alarms → SNS → Email</text>
  <text x="390" y="515" text-anchor="middle" font-size="10" fill="#d32f2f">🔴 RED (>90%)</text>
  <text x="390" y="533" text-anchor="middle" font-size="10" fill="#e65100">🟠 AMBER (>70%)</text>
  <text x="390" y="551" text-anchor="middle" font-size="10" fill="#1565c0">TPM/RPM threshold</text>

  <!-- Custom Metrics -->
  <rect x="70" y="580" width="420" height="55" rx="8" fill="white" stroke="#1565c0" stroke-width="1.5"/>
  <text x="280" y="600" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">Custom Metrics (namespace: BedrockLimits)</text>
  <text x="280" y="618" text-anchor="middle" font-size="9" fill="#555">TPM/RPM Utilization | RAGStatus | EffectiveQuota | TotalProfiles | Over50/75Pct</text>
  <text x="280" y="632" text-anchor="middle" font-size="9" fill="#555">Dimensions: AccountId, Region, ModelId</text>

  <!-- ===== SPOKE ACCOUNT ===== -->
  <rect x="600" y="80" width="460" height="630" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="830" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">Spoke / Source Account</text>

  <!-- Spoke Role -->
  <rect x="630" y="135" width="400" height="120" rx="8" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="830" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">BedrockLimitsTrackerSpokeRole</text>
  <text x="830" y="178" text-anchor="middle" font-size="11" fill="#1565c0">Trust: MonitoringAccount's LambdaRole</text>
  <text x="830" y="198" text-anchor="middle" font-size="10" fill="#1565c0">Allows: servicequotas:List*/Get*</text>
  <text x="830" y="215" text-anchor="middle" font-size="10" fill="#1565c0">        bedrock:ListInferenceProfiles/ListProvisionedModelThroughputs</text>
  <text x="830" y="232" text-anchor="middle" font-size="10" fill="#1565c0">        cloudwatch:GetMetricData/GetMetricStatistics</text>
  <text x="830" y="248" text-anchor="middle" font-size="10" fill="#555">(quotas read once/day, usage read every invocation)</text>

  <!-- Arrow: Lambda → Spoke Role -->
  <line x1="490" y1="232" x2="627" y2="195" stroke="#1565c0" stroke-width="3" marker-end="url(#arrBlue)"/>
  <rect x="500" y="198" width="125" height="22" rx="5" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="562" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">③ assumes</text>

  <!-- Service Quotas API -->
  <rect x="630" y="285" width="190" height="55" rx="8" fill="white" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="725" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Service Quotas API</text>
  <text x="725" y="325" text-anchor="middle" font-size="9" fill="#555">Actual per-model limits</text>
  <text x="725" y="337" text-anchor="middle" font-size="9" fill="#6a1b9a">⏱️ Cached 24h in S3</text>

  <!-- Bedrock API -->
  <rect x="840" y="285" width="190" height="55" rx="8" fill="white" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="935" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Bedrock API</text>
  <text x="935" y="325" text-anchor="middle" font-size="9" fill="#555">Inference profiles</text>
  <text x="935" y="337" text-anchor="middle" font-size="9" fill="#555">(SYSTEM + APPLICATION)</text>

  <!-- CloudWatch -->
  <rect x="630" y="365" width="400" height="55" rx="8" fill="white" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="830" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">CloudWatch: AWS/Bedrock Metrics</text>
  <text x="830" y="408" text-anchor="middle" font-size="9" fill="#555">Invocations | InputTokenCount | OutputTokenCount (1h window, 1-min period)</text>

  <!-- Arrows from Spoke Role to APIs -->
  <line x1="770" y1="255" x2="725" y2="282" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrTeal)"/>
  <line x1="880" y1="255" x2="935" y2="282" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrTeal)"/>
  <line x1="830" y1="255" x2="830" y2="362" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrTeal)"/>

  <!-- OAM Link -->
  <rect x="630" y="450" width="400" height="80" rx="8" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="830" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">OAM Link</text>
  <text x="830" y="498" text-anchor="middle" font-size="11" fill="#444">Shares: AWS::CloudWatch::Metric</text>
  <text x="830" y="518" text-anchor="middle" font-size="11" fill="#6a1b9a">Continuous flow — no Lambda needed — FREE</text>

  <!-- Arrow: OAM Link → Sink -->
  <path d="M 627 490 Q 560 460 490 430" fill="none" stroke="#6a1b9a" stroke-width="3" marker-end="url(#arrPurple)"/>
  <rect x="520" y="445" width="110" height="22" rx="5" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="575" y="460" text-anchor="middle" font-size="10" font-weight="bold" fill="#6a1b9a">④ metrics (free)</text>

  <!-- Native Metrics -->
  <rect x="630" y="560" width="400" height="80" rx="8" fill="white" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="830" y="583" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Native AWS/Bedrock Metrics (always on)</text>
  <text x="830" y="603" text-anchor="middle" font-size="10" fill="#555">Invocations | InputTokenCount | OutputTokenCount</text>
  <text x="830" y="623" text-anchor="middle" font-size="10" fill="#555">InvocationLatency | InvocationClientErrors | InvocationThrottles</text>
  <text x="830" y="638" text-anchor="middle" font-size="9" fill="#555">Per ModelId dimension — no config needed</text>

  <line x1="830" y1="557" x2="830" y2="533" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#arrPurple)"/>

  <!-- Legend -->
  <rect x="600" y="680" width="460" height="40" rx="8" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="620" y="705" font-size="10" fill="#1565c0">③ Lambda assumes SpokeRole → reads quotas (cached) + usage</text>
  <text x="900" y="705" font-size="10" fill="#6a1b9a">④ OAM streams metrics</text>
</svg>
