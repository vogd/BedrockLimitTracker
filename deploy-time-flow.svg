<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Arial, sans-serif">
  <rect width="1100" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#232f3e">Deploy-Time Flow</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#666">StackSet deploys spoke resources into target accounts</text>

  <defs>
    <marker id="arrOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e65100"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- ===== ADMIN ACCOUNT ===== -->
  <rect x="40" y="80" width="440" height="240" rx="12" fill="#fff3e0" stroke="#ff9800" stroke-width="2.5"/>
  <text x="260" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Admin / Management Account</text>
  
  <rect x="70" y="130" width="180" height="60" rx="8" fill="white" stroke="#ff9800" stroke-width="1.5"/>
  <text x="160" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">CloudFormation Service</text>
  <text x="160" y="175" text-anchor="middle" font-size="10" fill="#555">creates StackSet</text>

  <rect x="70" y="210" width="390" height="90" rx="8" fill="#fff8e1" stroke="#ffa000" stroke-width="1.5"/>
  <text x="265" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">AWSCloudFormationStackSetAdministrationRole</text>
  <text x="265" y="255" text-anchor="middle" font-size="11" fill="#444">Template: stackset-admin-role.yaml</text>
  <text x="265" y="275" text-anchor="middle" font-size="11" fill="#1565c0">Trust: cloudformation.amazonaws.com</text>
  <text x="265" y="292" text-anchor="middle" font-size="11" fill="#1565c0">Allows: sts:AssumeRole → *:role/...StackSetExecutionRole</text>

  <line x1="160" y1="190" x2="160" y2="207" stroke="#e65100" stroke-width="2"/>

  <!-- ===== SPOKE ACCOUNT ===== -->
  <rect x="580" y="80" width="480" height="590" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="820" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">Spoke / Source Account</text>
  <text x="820" y="128" text-anchor="middle" font-size="11" fill="#555">(each monitored account)</text>

  <!-- Execution Role -->
  <rect x="610" y="150" width="420" height="120" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="820" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">AWSCloudFormationStackSetExecutionRole</text>
  <text x="820" y="198" text-anchor="middle" font-size="11" fill="#444">Template: stackset-execution-role.yaml</text>
  <text x="820" y="218" text-anchor="middle" font-size="11" fill="#1565c0">Trust: AdminAccount's AdministrationRole</text>
  <text x="820" y="238" text-anchor="middle" font-size="10" fill="#1565c0">Allows: iam:CreateRole (SpokeRole) | oam:Create/DeleteLink | cloudwatch:Link | cloudformation:*</text>

  <!-- Arrow: Admin → Execution -->
  <line x1="460" y1="255" x2="607" y2="210" stroke="#e65100" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrOrange)"/>
  <rect x="480" y="218" width="120" height="24" rx="5" fill="#fff3e0" stroke="#ff9800"/>
  <text x="540" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">① assumes</text>

  <!-- Spoke Role -->
  <rect x="610" y="310" width="420" height="140" rx="8" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="820" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">BedrockLimitsTrackerSpokeRole</text>
  <text x="820" y="358" text-anchor="middle" font-size="11" fill="#444">Template: source-account.yaml (deployed by StackSet)</text>
  <text x="820" y="381" text-anchor="middle" font-size="11" fill="#1565c0">Trust: MonitoringAccount's LambdaRole</text>
  <text x="820" y="404" text-anchor="middle" font-size="10" fill="#1565c0">Allows: servicequotas:List*/Get* | bedrock:ListInferenceProfiles</text>
  <text x="820" y="421" text-anchor="middle" font-size="10" fill="#1565c0">        bedrock:ListProvisionedModelThroughputs | cloudwatch:GetMetric*</text>
  <text x="820" y="438" text-anchor="middle" font-size="10" fill="#1565c0">        bedrock:ListFoundationModels</text>

  <!-- Arrow: Execution → Spoke Role -->
  <line x1="820" y1="270" x2="820" y2="307" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrGreen)"/>
  <rect x="750" y="280" width="140" height="22" rx="5" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="820" y="295" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">② iam:CreateRole</text>

  <!-- OAM Link -->
  <rect x="610" y="480" width="420" height="80" rx="8" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="820" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">OAM Link</text>
  <text x="820" y="528" text-anchor="middle" font-size="11" fill="#444">Template: source-account.yaml (deployed by StackSet)</text>
  <text x="820" y="551" text-anchor="middle" font-size="11" fill="#1565c0">Shares: AWS::CloudWatch::Metric → Monitoring Account's Sink</text>

  <path d="M 720 270 L 720 477" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrGreen)"/>
  <text x="690" y="470" font-size="9" fill="#2e7d32">oam:CreateLink</text>

  <!-- S3 Cache Bucket (monitoring account) -->
  <rect x="40" y="380" width="440" height="80" rx="12" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="260" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">Monitoring Account — Also Creates:</text>
  <text x="260" y="428" text-anchor="middle" font-size="11" fill="#444">S3 Bucket: bedrock-limits-cache-{AccountId} (quota cache)</text>
  <text x="260" y="448" text-anchor="middle" font-size="11" fill="#444">OAM Sink | Lambda | EventBridge | Alarms | SSM Parameter</text>

  <!-- Legend -->
  <rect x="40" y="600" width="440" height="70" rx="8" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="260" y="622" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Deploy-Time Steps</text>
  <text x="70" y="642" font-size="11" fill="#e65100">① CloudFormation StackSet assumes ExecutionRole in spoke account</text>
  <text x="70" y="660" font-size="11" fill="#2e7d32">② ExecutionRole creates BedrockLimitsTrackerSpokeRole + OAM Link</text>
</svg>
